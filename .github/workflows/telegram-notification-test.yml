name: Telegram Notification Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-one-time-notification-test
  cancel-in-progress: false

jobs:
  notification-test:
    if: github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Unit test notification safeguards
        run: python -m unittest discover -s tests -p test_telegram_notification_test.py -v
      - name: Send private status-only Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_notification_test.py
