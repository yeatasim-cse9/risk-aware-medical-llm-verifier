name: Kaggle MedHallu Read-only Failure Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/medhallu-metadata-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify no raw logs are printed
        run: |
          python -m unittest discover -s tests -p test_medhallu_metadata_diagnostic.py -v
      - name: Install Kaggle CLI
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "::error::Missing Kaggle token"
            exit 1
          fi
          python -m pip install "kaggle==2.2.5" "six==1.17.0"
      - name: Download only existing metadata notebook output and report safe error classes
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python scripts/diagnose_medhallu_metadata_failure.py --out build/medhallu-metadata-diagnostic
