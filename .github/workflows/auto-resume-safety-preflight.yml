name: Automatic Resume Safety Preflight - Read Only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auto-resume-safety-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-auto-resume-safety-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run safety unit tests
        run: |
          python -m compileall -q scripts src tests
          python -m unittest discover -s tests -v
      - name: Install pinned Kaggle client
        run: python -m pip install "kaggle==2.2.5" "six==1.17.0"
      - name: Assess both Kaggle slots and saved checkpoints WITHOUT launching
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "::error::Kaggle API secret is missing"
            exit 1
          fi
          # Quota is UNKNOWN until independently verified; no API quota claims.
          python scripts/auto_resume_preflight.py --quota-signal unknown
          echo "AUTO_RESUME_SAFETY_DRY_RUN: VERIFIED"
