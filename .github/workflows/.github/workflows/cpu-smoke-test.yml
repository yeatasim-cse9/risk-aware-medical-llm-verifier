
name: Research CPU Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Python version
        run: python3 --version

      - name: Run deterministic CPU test
        run: |
          python3 -c '
          import hashlib
          import json
          import platform

          data = {
              "experiment_id": "actions-cpu-smoke-001",
              "seed": 42,
              "status": "success"
          }

          payload = json.dumps(data, sort_keys=True)
          checksum = hashlib.sha256(payload.encode()).hexdigest()

          print("OS:", platform.system())
          print("Experiment:", data["experiment_id"])
          print("SHA256:", checksum)

          assert len(checksum) == 64
          print("ACTIONS CPU SMOKE TEST SUCCESSFUL")
          '
