name: MASTER 01F-R13-G Private CPU Correction Baseline
on:
  workflow_dispatch:
    inputs:
      confirm_one_cpu_run:
        type: boolean
        required: true
        default: false
      confirm_private_inputs_and_rights:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: r13g-one-shot-private-cpu
  cancel-in-progress: false
jobs:
  submit:
    if: github.ref == 'refs/heads/main' && inputs.confirm_one_cpu_run && inputs.confirm_private_inputs_and_rights && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_r13g_correction_baseline.py -v
      - run: python -m pip install kaggle==2.2.5 six==1.17.0
      - name: One authorized private CPU submission and monitor
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R13G_PRIVATE_CONFIG: ${{ secrets.R13G_PRIVATE_CONFIG }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/r13g_private_cpu_controller.py
