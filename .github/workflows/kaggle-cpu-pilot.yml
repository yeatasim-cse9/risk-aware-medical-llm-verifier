name: Kaggle CPU Pilot Controller

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Prepare builds locally; auth-check tests Kaggle secret without launching a notebook"
        type: choice
        options: [prepare, auth-check, submit, status, collect]
        default: prepare
        required: true
      slot:
        description: "Use A for first run; B with resume to read A after A completes"
        type: choice
        options: [a, b]
        default: a
        required: true
      resume:
        description: "Attach the other slot's completed output (never use on first run)"
        type: boolean
        default: false
      source_commit:
        description: "Optional immutable Git commit SHA for reproducing a previous run"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: kaggle-cpu-pilot-controller
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact research source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build immutable CPU-only Kaggle script
        if: inputs.operation == 'prepare' || inputs.operation == 'submit'
        shell: bash
        env:
          SLOT: ${{ inputs.slot }}
          RESUME: ${{ inputs.resume }}
        run: |
          COMMIT="$(git rev-parse HEAD)"
          if [[ "$RESUME" == "true" ]]; then FLAG="--resume"; else FLAG=""; fi
          python scripts/build_kernel.py --commit "$COMMIT" --slot "$SLOT" $FLAG --out build/kaggle
      - name: Upload prepared script for review
        if: inputs.operation == 'prepare'
        uses: actions/upload-artifact@v4
        with:
          name: cpu-pilot-source-${{ github.run_id }}
          path: build/kaggle/
          retention-days: 7
      - name: Require Kaggle API token
        if: inputs.operation != 'prepare'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "::error::KAGGLE_API_TOKEN is not set in GitHub Actions Secrets."
            exit 1
          fi
      - name: Install pinned Kaggle CLI
        if: inputs.operation != 'prepare'
        run: python -m pip install "kaggle==2.2.4"
      - name: Guard against duplicate, failed or unfinished remote runs
        if: inputs.operation == 'submit' || inputs.operation == 'collect'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          OP: ${{ inputs.operation }}
          SLOT: ${{ inputs.slot }}
          RESUME: ${{ inputs.resume }}
        run: |
          set -euo pipefail
          KERNEL="yeatasimbillah/medical-llm-cpu-auto-$SLOT"
          if [[ "$OP" == "collect" ]]; then
            python scripts/kaggle_status.py "$KERNEL" --require complete
          else
            python scripts/kaggle_status.py "$KERNEL" --require not-active
            if [[ "$RESUME" == "true" ]]; then
              if [[ "$SLOT" == "a" ]]; then OTHER=b; else OTHER=a; fi
              SOURCE="yeatasimbillah/medical-llm-cpu-auto-$OTHER"
              python scripts/kaggle_status.py "$SOURCE" --require complete
              mkdir -p build/previous
              kaggle kernels output "$SOURCE" -p build/previous
              python scripts/verify_checkpoint.py build/previous --expected-commit "$(git rev-parse HEAD)"
            fi
          fi
      - name: Kaggle control operation
        if: inputs.operation != 'prepare'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          OP: ${{ inputs.operation }}
          SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          KERNEL="yeatasimbillah/medical-llm-cpu-auto-$SLOT"
          case "$OP" in
            auth-check)
              # Query the authenticated user's own notebooks without printing names.
              # A successful request validates API access, not notebook execution.
              if kaggle kernels list --mine >/dev/null 2>&1; then
                echo "KAGGLE API AUTH CHECK SUCCESSFUL"
              else
                echo "::error::Kaggle API authentication check failed. Verify the token and Kaggle CLI."
                exit 1
              fi
              ;;
            submit)
              echo "Submitting a private CPU-only synthetic notebook: $KERNEL"
              kaggle kernels push -p build/kaggle
              ;;
            status)
              kaggle kernels status "$KERNEL"
              ;;
            collect)
              mkdir -p build/output
              kaggle kernels output "$KERNEL" -p build/output
              python scripts/verify_checkpoint.py build/output
              ;;
            *)
              echo "::error::Unsupported operation"
              exit 1
              ;;
          esac
      - name: Upload synthetic checkpoint
        if: inputs.operation == 'collect' && success()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-checkpoint-${{ github.run_id }}
          path: build/output/
          retention-days: 14
      - name: Optional status-only Telegram notification
        if: always() && inputs.operation != 'prepare' && inputs.operation != 'auth-check'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OP: ${{ inputs.operation }}
          RESULT: ${{ job.status }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            python scripts/notify_telegram.py failed
          elif [[ "$OP" == "submit" ]]; then
            python scripts/notify_telegram.py submitted
          elif [[ "$OP" == "status" ]]; then
            python scripts/notify_telegram.py checked
          else
            python scripts/notify_telegram.py collected
          fi
