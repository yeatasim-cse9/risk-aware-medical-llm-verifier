name: Telegram Chat ID - Private Delivery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-chat-id:
    if: github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check private chat selection tests
        run: python -m unittest discover -s tests -p test_telegram_chat_id.py -v
      - name: Privately deliver Chat ID to the Telegram chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_chat_id.py
