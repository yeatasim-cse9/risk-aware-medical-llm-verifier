name: One-Time Kaggle CPU Synthetic Pilot Launch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kaggle-first-launch.yml

permissions:
  contents: read

concurrency:
  group: kaggle-cpu-pilot-controller
  cancel-in-progress: false

jobs:
  first-cpu-launch:
    if: github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run offline tests before any Kaggle mutation
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_kernel.py --commit "$GITHUB_SHA" --slot a --out build/kaggle
          python -m py_compile build/kaggle/runner.py
      - name: Install verified Kaggle CLI and dependency
        run: python -m pip install "kaggle==2.2.5" "six==1.17.0"
      - name: Verify credential and no previous active Kaggle notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::Kaggle secret missing"; exit 1; }
          STATE="$(python scripts/kaggle_status.py yeatasimbillah/medical-llm-cpu-auto-a --require not-active)"
          echo "$STATE"
          if ! grep -q ' = missing' <<<"$STATE"; then
            echo "::error::Notebook already exists. Review before changing it."
            exit 1
          fi
      - name: Submit once with CPU only
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels push -p build/kaggle --timeout 3600
          echo "KAGGLE CPU PILOT SUBMISSION REQUESTED"
      - name: Store non-sensitive run build metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: first-kaggle-cpu-pilot-build
          path: build/kaggle/kernel-metadata.json
          retention-days: 7
