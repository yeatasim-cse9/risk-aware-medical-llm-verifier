name: MASTER 01F-R9C Readiness and Monitoring
on:
  pull_request:
    paths:
      - scripts/e1_master01fr9c_workflow.py
      - tests/test_e1_master01fr9c_workflow.py
      - .github/workflows/e1-master01fr9c-readiness.yml
      - .github/workflows/e1-master01fr9c-submit.yml
  push:
    branches: [main]
    paths:
      - scripts/e1_master01fr9c_workflow.py
      - tests/test_e1_master01fr9c_workflow.py
      - .github/workflows/e1-master01fr9c-readiness.yml
      - .github/workflows/e1-master01fr9c-submit.yml
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preflight, qualify, status, verify]
        default: preflight
        required: true
      confirm_cpu_qualification:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: master01fr9c-private-kaggle
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_e1_master01fr9c_workflow.py -v
  remote:
    needs: synthetic
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier'
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install kaggle==2.2.5 six==1.17.0
      - name: Read-only readiness or explicitly approved CPU qualification
        env:
          OP: ${{ inputs.operation }}
          R9C_CPU: ${{ inputs.confirm_cpu_qualification }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          THESIS_PRIVATE_ARCHIVE_READ_TOKEN: ${{ secrets.THESIS_PRIVATE_ARCHIVE_READ_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/e1_master01fr9c_workflow.py "$OP"
