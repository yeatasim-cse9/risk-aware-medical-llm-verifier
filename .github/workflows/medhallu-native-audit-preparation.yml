name: MedHallu Native Row Audit Preparation - Synthetic Only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/medhallu-native-audit-preparation.yml
      - src/research_data/medhallu_native_audit.py
      - tests/test_medhallu_native_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-audit:
    if: github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout trusted code only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test private row-audit logic with synthetic fake records ONLY
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_medhallu_native_audit.py -v
          python -m unittest discover -s tests -p test_e1_readiness.py -v
          python scripts/e1_readiness.py
          echo "MEDHALLU_NATIVE_AUDIT_LOGIC_TESTED_SYNTHETIC_ONLY"
          echo "NO_DATASET_DOWNLOAD_NO_KAGGLE_SUBMISSION_NO_EXPERIMENT"
