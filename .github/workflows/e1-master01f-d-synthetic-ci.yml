name: MASTER 01F-D Projected Pilot Synthetic CI
on:
  pull_request:
    paths:
      - 'scripts/e1_master01f_d_*.py'
      - 'tests/test_e1_master01f_d_v1.py'
      - '.github/workflows/e1-master01f-d-synthetic-ci.yml'
      - 'docs/E1_MASTER01F_D_PROTOCOL.md'
  push:
    branches: [main]
    paths:
      - 'scripts/e1_master01f_d_*.py'
      - 'tests/test_e1_master01f_d_v1.py'
      - '.github/workflows/e1-master01f-d-synthetic-ci.yml'
      - 'docs/E1_MASTER01F_D_PROTOCOL.md'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p test_e1_master01f_d_v1.py -v
      - run: PYTHONPATH=scripts python -c "import subprocess; import e1_master01f_d_controller_v1 as c; c.verify_code(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())"
      - run: python -m py_compile scripts/e1_master01f_d_inputs_v1.py scripts/e1_master01f_d_pilot_v1.py scripts/e1_master01f_d_controller_v1.py
