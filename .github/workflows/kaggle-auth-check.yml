name: Kaggle API Auth Check (No Notebook Launch)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pinned Kaggle CLI
        run: |
          python -m pip install "kaggle==2.2.5" "six==1.17.0"
          kaggle --version

      - name: Check account's Kaggle API access
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "::error::KAGGLE_API_TOKEN repository secret is missing"
            exit 1
          fi
          # Only check read access; do not list notebook metadata in logs.
          if kaggle kernels list --mine --page-size 1 >/dev/null 2>&1; then
            echo "KAGGLE API AUTH CHECK SUCCESSFUL"
          else
            echo "::error::Kaggle authentication or API access failed (response hidden)"
            exit 1
          fi
