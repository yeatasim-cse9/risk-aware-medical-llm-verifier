name: MASTER 01F-F Custody Recovery Synthetic CI
on:
  pull_request:
    paths:
      - 'scripts/e1_master01f_f_custody_v1.py'
      - 'tests/test_e1_master01f_f_custody_v1.py'
      - 'docs/E1_MASTER01F_F_CUSTODY_RECOVERY.md'
      - '.github/workflows/e1-master01f-f-custody-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/e1_master01f_f_custody_v1.py'
      - 'tests/test_e1_master01f_f_custody_v1.py'
      - 'docs/E1_MASTER01F_F_CUSTODY_RECOVERY.md'
      - '.github/workflows/e1-master01f-f-custody-ci.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: openssl version
      - run: python -m unittest discover -s tests -p test_e1_master01f_f_custody_v1.py -v
