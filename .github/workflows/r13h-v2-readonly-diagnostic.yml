name: R13-H V2 Read-only Failure Diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'scripts/r13h_v2_readonly_diagnostic.py'
      - '.github/workflows/r13h-v2-readonly-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r13h-v2-readonly-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install kaggle==2.2.5 six==1.17.0
      - name: Read-only controller gate diagnosis (no GPU or weights)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          R13G_PRIVATE_CONFIG: ${{ secrets.R13G_PRIVATE_CONFIG }}
          R13H_PRIVATE_EXPECTED: ${{ secrets.R13H_PRIVATE_EXPECTED }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/r13h_v2_readonly_diagnostic.py
