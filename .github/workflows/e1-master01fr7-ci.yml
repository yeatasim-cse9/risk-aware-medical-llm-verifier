name: MASTER 01F-R7 Lexical Synthetic CI
on:
  pull_request:
    paths:
      - scripts/e1_master01fr7_lexical_v1.py
      - tests/test_e1_master01fr7_lexical_v1.py
      - .github/workflows/e1-master01fr7-ci.yml
  push:
    branches: [main]
    paths:
      - scripts/e1_master01fr7_lexical_v1.py
      - tests/test_e1_master01fr7_lexical_v1.py
      - .github/workflows/e1-master01fr7-ci.yml
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 threadpoolctl==3.6.0 joblib==1.4.2
      - run: python -m unittest discover -s tests -p test_e1_master01fr7_lexical_v1.py -v
