name: First Kaggle CPU Output Verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kaggle-first-output-check.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned Kaggle CLI
        run: python -m pip install "kaggle==2.2.5" "six==1.17.0"
      - name: Poll actual Kaggle notebook status (read-only)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import os, subprocess, sys, time
          sys.path.insert(0, "scripts")
          from kaggle_status import parse_status
          kernel = "yeatasimbillah/medical-llm-cpu-auto-a"
          for attempt in range(1, 31):
              r = subprocess.run(["kaggle", "kernels", "status", kernel],
                                 capture_output=True, text=True, timeout=60)
              if r.returncode != 0:
                  raise RuntimeError("Kaggle status API did not succeed")
              state = parse_status(r.stdout + "\n" + r.stderr)
              print(f"Remote status check {attempt}: {state}", flush=True)
              if state == "complete":
                  print("REMOTE KAGGLE NOTEBOOK COMPLETE", flush=True)
                  break
              if state in {"error", "failed", "cancelled", "cancelacknowledged"}:
                  raise RuntimeError(f"Kaggle remote run ended with {state}")
              if attempt == 30:
                  print("REMOTE KAGGLE STILL ACTIVE: another check is required", flush=True)
                  sys.exit(0)
              time.sleep(10)
          PY
      - name: Download output when Kaggle version is complete
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/kaggle_status.py yeatasimbillah/medical-llm-cpu-auto-a --require complete
          mkdir -p build/first-output
          kaggle kernels output yeatasimbillah/medical-llm-cpu-auto-a -p build/first-output
          python scripts/verify_checkpoint.py build/first-output --expected-commit 1a90191ae2734a74807eb53fa7d5b27a4e44c78f
          python - <<'PY'
          import json
          from pathlib import Path
          found = list(Path("build/first-output").rglob("cpu-pilot-automation.json"))
          assert len(found) == 1
          s = json.loads(found[0].read_text())
          assert len(s["completed_task_ids"]) == 40
          assert s["status"] == "in_progress"
          print("REMOTE 40-TASK CHECKPOINT VERIFIED", flush=True)
          PY
      - name: Store only synthetic checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-first-synthetic-checkpoint
          path: build/first-output/**/cpu-pilot-automation.json
          retention-days: 7
