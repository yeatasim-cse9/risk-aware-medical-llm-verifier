name: MASTER 01F-R9C One-shot Private GPU Submission
on:
  workflow_dispatch:
    inputs:
      confirm_one_gpu_run:
        type: boolean
        default: false
        required: true
      confirm_supervisor_review:
        type: boolean
        default: false
        required: true
      confirm_rights_and_quota:
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: master01fr9c-private-kaggle
  cancel-in-progress: false
jobs:
  submit:
    if: github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier' && github.ref == 'refs/heads/main' && inputs.confirm_one_gpu_run && inputs.confirm_supervisor_review && inputs.confirm_rights_and_quota && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_e1_master01fr9c_workflow.py -v
      - run: python -m pip install kaggle==2.2.5 six==1.17.0
      - name: Exactly one authorized private submission and monitor
        env:
          R9C_GPU: ${{ inputs.confirm_one_gpu_run }}
          R9C_SUPERVISOR: ${{ inputs.confirm_supervisor_review }}
          R9C_RIGHTS_QUOTA: ${{ inputs.confirm_rights_and_quota }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          THESIS_PRIVATE_ARCHIVE_READ_TOKEN: ${{ secrets.THESIS_PRIVATE_ARCHIVE_READ_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/e1_master01fr9c_workflow.py submit
