name: Verify Kaggle Slot B 80-Task Checkpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kaggle-slot-b-verify-once.yml

permissions:
  contents: read

jobs:
  verify-b:
    if: github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned Kaggle CLI
        run: python -m pip install "kaggle==2.2.5" "six==1.17.0"
      - name: Validate Kaggle slot B completed and saved output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::Kaggle token missing"; exit 1; }
          python scripts/kaggle_status.py 'yeatasimbillah/medical-llm-cpu-auto-b' --require complete
          mkdir -p build/slot-b-output
          kaggle kernels output 'yeatasimbillah/medical-llm-cpu-auto-b' -p build/slot-b-output
          python scripts/verify_checkpoint.py build/slot-b-output --expected-commit '1a90191ae2734a74807eb53fa7d5b27a4e44c78f'
          python - <<'PY'
          import json
          from pathlib import Path
          paths=list(Path('build/slot-b-output').rglob('cpu-pilot-automation.json'))
          assert len(paths)==1, f'Expected one checkpoint, got {len(paths)}'
          state=json.loads(paths[0].read_text(encoding='utf-8'))
          ids=state['completed_task_ids']
          assert ids==list(range(80)), 'Task IDs mismatch or not 80 tasks'
          assert state['status']=='in_progress'
          print('SLOT B REMOTE CHECKPOINT VERIFIED: 80/100',flush=True)
          PY
      - name: Retain only the synthetic checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: slot-b-80-task-checkpoint
          path: build/slot-b-output/checkpoints/cpu-pilot-automation.json
          retention-days: 7
