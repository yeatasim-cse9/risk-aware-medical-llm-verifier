name: Kaggle to Telegram Status Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-telegram-status-pilot
  cancel-in-progress: false

jobs:
  integrated-status:
    if: github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run unit tests before contacting external services
        run: |
          python -m unittest discover -s tests -v
      - name: Install pinned Kaggle CLI
        run: python -m pip install "kaggle==2.2.5" "six==1.17.0"
      - name: Verify completed Kaggle A notebook and retrieve saved synthetic output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "::error::Kaggle API secret missing"
            exit 1
          fi
          python scripts/kaggle_status.py yeatasimbillah/medical-llm-cpu-auto-a --require complete
          mkdir -p build/monitor-input
          kaggle kernels output yeatasimbillah/medical-llm-cpu-auto-a -p build/monitor-input
          python scripts/verify_checkpoint.py build/monitor-input --expected-commit 1a90191ae2734a74807eb53fa7d5b27a4e44c78f
      - name: Send only validated synthetic checkpoint progress to private Telegram chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_synthetic_pilot_status.py build/monitor-input
