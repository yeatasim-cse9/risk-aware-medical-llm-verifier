name: Safe Kaggle Monitor - Read Only Dry Run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kaggle-safe-monitor-dryrun.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-kaggle-monitor-check
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.repository == 'yeatasim-cse9/risk-aware-medical-llm-verifier' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout verified code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run safe-monitor unit tests
        run: python -m unittest discover -s tests -v
      - name: Install pinned Kaggle CLI
        run: python -m pip install "kaggle==2.2.5" "six==1.17.0"
      - name: Read completed Kaggle notebook output - no submission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "::error::Missing Kaggle API token"
            exit 1
          fi
          python scripts/kaggle_status.py yeatasimbillah/medical-llm-cpu-auto-a --require complete
          mkdir -p build/monitor
          kaggle kernels output yeatasimbillah/medical-llm-cpu-auto-a -p build/monitor
          python scripts/safe_monitor_decision.py build/monitor --remote-status complete --slot a
          echo "SAFE CLOUD MONITOR DRY RUN VERIFIED"
